<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Логотип «Счастье есть»">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7E9C72"/>
      <stop offset="1" stop-color="#557050"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EDF0E4"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF0E2"/>
      <stop offset="1" stop-color="#C8D8BC"/>
    </linearGradient>
  </defs>

  <!-- круг-основа -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#F4F7EF" stroke-opacity=".34" stroke-width="3"/>

  <!-- пар в форме сердца -->
  <path d="M256 96c-16 10-30 22-30 38 0 13 9 22 20 22 7 0 12-4 15-9"
        fill="none" stroke="url(#steam)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <path d="M256 96c16 10 30 22 30 38 0 13-9 22-20 22-7 0-12-4-15-9"
        fill="none" stroke="url(#steam)" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <path d="M256 138c-9 16-9 30 0 44 9-14 9-28 0-44z" fill="url(#steam)" opacity=".9"/>

  <!-- ручка чашки -->
  <path d="M322 226c24 0 42 17 42 39s-18 37-42 37" fill="none"
        stroke="url(#cup)" stroke-width="21" stroke-linecap="round"/>

  <!-- корпус чашки -->
  <path d="M182 226h140c0 60-6 104-23 124-13 15-42 19-47 19s-34-4-47-19c-17-20-23-64-23-124z"
        fill="url(#cup)"/>

  <!-- поверхность напитка -->
  <ellipse cx="252" cy="228" rx="70" ry="17" fill="#F7FAF2"/>
  <ellipse cx="252" cy="228" rx="54" ry="11" fill="#6E8A64" opacity=".55"/>

  <!-- блик кофе -->
  <path d="M238 220c-13-7-28-2-28 9 0 11 15 14 22 9 8 5 22 3 28-6"
        fill="none" stroke="#F7FAF2" stroke-width="6" stroke-linecap="round" opacity=".9"/>

  <!-- блюдце -->
  <ellipse cx="252" cy="382" rx="78" ry="12" fill="#F4F7EF" opacity=".92"/>
  <ellipse cx="252" cy="378" rx="78" ry="12" fill="url(#cup)" opacity=".55"/>
</svg>
